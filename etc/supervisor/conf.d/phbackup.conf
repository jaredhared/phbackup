[program:phb-worker]
process_name=%(program_name)s-%(process_num)d
command=/root/scripts/phbackup/worker.php
autostart=true
autorestart=true
user=root
numprocs=3
redirect_stderr=true
stdout_logfile=/var/log/phbackup.log
; Worker should run at least 5s to be considered started
startsecs=5
startretries=10
; Stop/kill the whole process group, so rsync/ssh/telnet children do not stay orphaned
stopasgroup=true
killasgroup=true
stopwaitsecs=30
